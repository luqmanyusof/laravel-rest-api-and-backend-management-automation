    const LucideIcon = ({ name, className = "w-5 h-5", fallbackEmoji = "📌" }) => {
      const iconRef = useRef(null);

      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({
            attrs: { class: className },
            nameAttr: 'data-lucide'
          });
        }
      }, [name, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center">{fallbackEmoji}</span>;
    };

    // Mermaid Diagram Component
    const MermaidDiagram = ({ definition, id }) => {
      const containerRef = useRef(null);

      useEffect(() => {
        if (window.mermaid && containerRef.current && definition) {
          try {
            window.mermaid.initialize({
              startOnLoad: false,
              theme: 'neutral',
              securityLevel: 'loose',
              themeVariables: {
                primaryColor: '#e4e4e7',
                primaryTextColor: '#18181b',
                primaryBorderColor: '#a1a1aa',
                lineColor: '#52525b',
                secondaryColor: '#f4f4f5',
                tertiaryColor: '#fafafa'
              }
            });
            const uniqueId = `mermaid-svg-${id}-${Math.floor(Math.random() * 10000)}`;
            window.mermaid.render(uniqueId, definition).then(({ svg }) => {
              if (containerRef.current) {
                containerRef.current.innerHTML = svg;
              }
            }).catch(err => {
              console.error("Mermaid Render Error:", err);
              if (containerRef.current) {
                containerRef.current.innerHTML = `<pre class="text-xs text-zinc-500 font-mono p-4 bg-zinc-100 rounded border border-zinc-200 overflow-x-auto">${definition}</pre>`;
              }
            });
          } catch (e) {
            console.error(e);
          }
        }
      }, [definition, id]);

      return (
        <div className="w-full flex justify-center items-center overflow-x-auto p-2 bg-white rounded-lg border border-zinc-200 shadow-sm" ref={containerRef}>
          <div className="text-xs text-zinc-400 py-8">Rendering diagram...</div>
        </div>
      );
    };

    // Main App Component
    function App() {
      const [currentSlideIdx, setCurrentSlideIdx] = useState(0);
      const [showNotes, setShowNotes] = useState(false);
      const [showGrid, setShowGrid] = useState(false);
      const [isFullscreen, setIsFullscreen] = useState(false);
      const [showShortcuts, setShowShortcuts] = useState(false);

      const slides = presentationData.slides;
      const slide = slides[currentSlideIdx];
      const totalSlides = slides.length;

      // Keyboard Navigation
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "ArrowRight" || e.key === "Space" || e.key === "PageDown") {
            e.preventDefault();
            nextSlide();
          } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
            e.preventDefault();
            prevSlide();
          } else if (e.key.toLowerCase() === "n") {
            setShowNotes(prev => !prev);
          } else if (e.key.toLowerCase() === "g") {
            setShowGrid(prev => !prev);
          } else if (e.key.toLowerCase() === "f") {
            toggleFullscreen();
          } else if (e.key === "?") {
            setShowShortcuts(prev => !prev);
          }
        };

        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [currentSlideIdx]);

      const nextSlide = () => {
        if (currentSlideIdx < totalSlides - 1) {
          setCurrentSlideIdx(prev => prev + 1);
        }
      };

      const prevSlide = () => {
        if (currentSlideIdx > 0) {
          setCurrentSlideIdx(prev => prev - 1);
        }
      };

      const jumpToSlide = (index) => {
        setCurrentSlideIdx(index);
        setShowGrid(false);
      };

      const toggleFullscreen = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().then(() => setIsFullscreen(true)).catch(err => console.error(err));
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen().then(() => setIsFullscreen(false)).catch(err => console.error(err));
          }
        }
      };

      return (
        <div className="h-full flex flex-col bg-zinc-100 text-zinc-900 font-sans">
          
          {/* Top Navigation Bar */}
          <header className="bg-white border-b border-zinc-200 px-4 py-2.5 flex items-center justify-between shrink-0 shadow-sm z-10">

              </div>

            </div>

              <button
                onClick={() => setShowNotes(!showNotes)}
                className={`p-2 text-xs font-medium rounded-lg border transition flex items-center space-x-1.5 ${
                  showNotes 
                    ? 'bg-zinc-900 text-zinc-50 border-zinc-900' 
                    : 'bg-zinc-50 text-zinc-700 border-zinc-200 hover:bg-zinc-100'
                }`}

              <button
                onClick={() => setShowGrid(!showGrid)}
                className={`p-2 text-xs font-medium rounded-lg border transition flex items-center space-x-1.5 ${
                  showGrid 
                    ? 'bg-zinc-900 text-zinc-50 border-zinc-900' 
                    : 'bg-zinc-50 text-zinc-700 border-zinc-200 hover:bg-zinc-100'
                }`}
                title="Overview Grid (G)"
              >
                <LucideIcon name="grid" className="w-4 h-4" fallbackEmoji="🔲" />
                <span className="hidden sm:inline">Overview</span>
              </button>

              <button
                onClick={toggleFullscreen}
                className="p-2 text-xs font-medium bg-zinc-50 text-zinc-700 border border-zinc-200 hover:bg-zinc-100 rounded-lg transition"
                title="Toggle Fullscreen (F)"
              >
                <LucideIcon name={isFullscreen ? "minimize" : "maximize"} className="w-4 h-4" fallbackEmoji="⛶" />
              </button>

              <button
                onClick={() => setShowShortcuts(!showShortcuts)}
                className="p-2 text-xs font-medium bg-zinc-50 text-zinc-700 border border-zinc-200 hover:bg-zinc-100 rounded-lg transition"
                title="Keyboard Shortcuts (?)"
              >
                <LucideIcon name="help-circle" className="w-4 h-4" fallbackEmoji="❓" />
              </button>
            </div>
          </header>

          {/* Progress Bar */}
          <div className="w-full bg-zinc-200 h-1 shrink-0">
            <div 
              className="bg-zinc-900 h-1 transition-all duration-300"
              style={{ width: `${((currentSlideIdx + 1) / totalSlides) * 100}%` }}
            ></div>
          </div>

          {/* Main Slide Stage Area */}
          <main className="flex-1 overflow-hidden p-4 sm:p-6 flex items-center justify-center relative">
            <div className="w-full max-w-6xl h-full flex flex-col bg-white rounded-xl border border-zinc-200 shadow-xl shadow-zinc-200/50 overflow-hidden relative">
              
              {/* SLIDE TYPE 1: TITLE SLIDE */}
              {slide.type === "title" && (
                <div className="h-full flex flex-col justify-between p-8 sm:p-12 bg-gradient-to-br from-zinc-900 via-zinc-800 to-zinc-950 text-white relative overflow-hidden">
                  <div className="absolute top-0 right-0 -mr-16 -mt-16 w-96 h-96 bg-zinc-700/20 rounded-full blur-3xl pointer-events-none"></div>
                  
                  <div className="space-y-6 z-10 max-w-3xl my-auto">
                    <span className="inline-flex items-center px-3 py-1 rounded-full text-xs font-mono font-medium bg-zinc-700/60 text-zinc-200 border border-zinc-600/50 backdrop-blur-sm">
                      {slide.footer || "3-Day Hands-on Integration Training"}
                    </span>
                    <h1 className="text-3xl sm:text-5xl font-bold tracking-tight text-white leading-tight">
                      {slide.title}
                    </h1>
                    <p className="text-lg sm:text-xl text-zinc-300 font-normal leading-relaxed">
                      {slide.subtitle}
                    </p>
                  </div>

                  <div className="pt-8 border-t border-zinc-700/60 flex flex-wrap items-center justify-between gap-4 z-10 text-xs text-zinc-400 font-mono">
                    <div className="flex items-center space-x-2">
                      <LucideIcon name="user" className="w-4 h-4 text-zinc-300" fallbackEmoji="👤" />
                      <span>Luqman Hakim Bin Yusof</span>
                    </div>
                    <div className="flex items-center space-x-2">
                      <LucideIcon name="code" className="w-4 h-4 text-zinc-300" fallbackEmoji="🛠️" />
                      <span>Laravel • SOAP • SFTP • Cron</span>
                    </div>
                  </div>
                </div>
              )}

              {/* SLIDE TYPE 2: SECTION DIVIDER SLIDE */}
              {slide.type === "section" && (
                <div className="h-full flex flex-col justify-center items-center p-8 sm:p-12 bg-zinc-900 text-white text-center relative">
                  <div className="max-w-2xl space-y-4">
                    <span className="text-xs font-mono uppercase tracking-widest text-zinc-400 bg-zinc-800 px-3 py-1 rounded-full border border-zinc-700">
                      Module Section
                    </span>
                    <h2 className="text-3xl sm:text-5xl font-bold tracking-tight text-zinc-50">
                      {slide.title}
                    </h2>
                    <p className="text-lg text-zinc-300 leading-relaxed font-light">
                      {slide.subtitle}
                    </p>
                  </div>
                </div>
              )}

              {/* SLIDE TYPE 3: CONTENT SLIDES */}
              {slide.type === "content" && (
                <div className="h-full flex flex-col p-6 sm:p-8 overflow-y-auto">
                  
                  {/* Slide Header */}
                  <div className="mb-6 shrink-0 border-b border-zinc-100 pb-4">
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-xs font-mono font-semibold uppercase tracking-wider text-zinc-500 bg-zinc-100 px-2.5 py-1 rounded">
                        {slide.section}
                      </span>
                      <span className="text-xs font-mono text-zinc-400">#0{slide.n}</span>
                    </div>
                    <h2 className="text-2xl sm:text-3xl font-bold text-zinc-900 tracking-tight mt-1.5">
                      {slide.title}
                    </h2>
                    {slide.summary && (
                      <p className="text-sm text-zinc-600 mt-1 font-medium">
                        {slide.summary}
                      </p>
                    )}
                  </div>

                  {/* Main Content Grid */}
                  <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 min-h-0">
                    
                    {/* Left Column: Points or Special Layout */}
                    <div className={`${slide.diagram ? "lg:col-span-5" : "lg:col-span-12"} flex flex-col justify-start space-y-3`}>
                      
                      {/* Special Bio Cards Layout (Slide 2) */}
                      {slide.layout === "bio-icon-cards" && slide.fields ? (
                        <div className="grid grid-cols-1 gap-4 w-full">
                          {slide.fields.map((field, idx) => (
                            <div key={idx} className="p-4 rounded-xl bg-zinc-50 border border-zinc-200 flex items-start space-x-4">
                              <div className="p-3 bg-white border border-zinc-200 rounded-lg text-zinc-900 shadow-sm shrink-0">
                                <LucideIcon name={field.icon} className="w-6 h-6" fallbackEmoji={field.emoji} />
                              </div>
                              <div>
                                <span className="text-xs font-mono font-semibold text-zinc-500 uppercase tracking-wider">
                                  {field.label}
                                </span>
                                <p className="text-sm sm:text-base font-semibold text-zinc-800 mt-0.5">
                                  {field.value}
                                </p>
                              </div>
                            </div>
                          ))}
                        </div>
                      ) : (
                        /* Standard Points List */
                        <ul className="space-y-3">
                          {slide.points && slide.points.map((pt, i) => (
                            <li key={i} className="flex items-start space-x-3 p-3 rounded-lg bg-zinc-50/80 border border-zinc-200/60 hover:border-zinc-300 transition">
                              <span className="w-5 h-5 rounded-full bg-zinc-900 text-white text-xs font-mono flex items-center justify-center shrink-0 mt-0.5">
                                {i + 1}
                              </span>
                              <span className="text-sm text-zinc-700 leading-relaxed font-normal">
                                {pt}
                              </span>
                            </li>
                          ))}
                        </ul>
                      )}
                    </div>

                    {/* Right Column: Diagrams / Tables / Visuals */}
                    {slide.diagram && (
                      <div className="lg:col-span-7 flex flex-col justify-start min-h-0">
                        <div className="bg-zinc-50 rounded-xl p-4 border border-zinc-200 flex flex-col h-full overflow-hidden">
                          {slide.diagram.caption && (
                            <div className="text-xs font-mono font-semibold text-zinc-600 mb-2 flex items-center space-x-1.5 shrink-0">
                              <LucideIcon name="eye" className="w-3.5 h-3.5 text-zinc-500" fallbackEmoji="👁️" />
                              <span>{slide.diagram.caption}</span>
                            </div>
                          )}

                          {/* Render Mermaid Diagrams */}
                          {slide.diagram.mermaid && (
                            <div className="flex-1 flex items-center justify-center overflow-auto min-h-0">
                              <MermaidDiagram definition={slide.diagram.mermaid} id={slide.n} />
                            </div>
                          )}

                          {/* Render Tables / Matrix / Comparisons */}
                          {slide.diagram.columns && slide.diagram.rows && (
                            <div className="flex-1 overflow-auto rounded-lg border border-zinc-200 bg-white">
                              <table className="w-full text-left text-xs">
                                <thead className="bg-zinc-100 border-b border-zinc-200 font-mono text-zinc-700 uppercase">
                                  <tr>
                                    {slide.diagram.columns.map((col, cIdx) => (
                                      <th key={cIdx} className="p-2.5 font-semibold">
                                        {col}
                                      </th>
                                    ))}
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-zinc-200 font-sans">
                                  {slide.diagram.rows.map((row, rIdx) => (
                                    <tr key={rIdx} className={rIdx % 2 === 0 ? "bg-white" : "bg-zinc-50/50"}>
                                      {row.map((cell, cellIdx) => (
                                        <td key={cellIdx} className={`p-2.5 text-zinc-700 ${cellIdx === 0 ? 'font-medium text-zinc-900 font-mono' : ''}`}>
                                          {cell}
                                        </td>
                                      ))}
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                          )}
                        </div>
                      </div>
                    )}

                  </div>

                  {/* Slide Footer Info */}
                  <div className="mt-auto pt-4 border-t border-zinc-100 flex items-center justify-between text-xs text-zinc-400 font-mono shrink-0">
                    <span>{presentationData.course.title}</span>
                    <span>Practical Training Series</span>
                  </div>

                </div>
              )}

            </div>
          </main>

          {/* Bottom Control Bar */}
          <footer className="bg-white border-t border-zinc-200 px-4 py-3 flex items-center justify-between shrink-0 shadow-sm z-10">
            <div className="flex items-center space-x-2">
              <button
                onClick={prevSlide}
                disabled={currentSlideIdx === 0}
                className="px-3.5 py-1.5 text-xs font-semibold rounded-lg border border-zinc-200 bg-zinc-50 text-zinc-700 hover:bg-zinc-100 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center space-x-1"
              >
                <LucideIcon name="chevron-left" className="w-4 h-4" fallbackEmoji="◀" />
                <span>Prev</span>
              </button>

              <button
                onClick={nextSlide}
                disabled={currentSlideIdx === totalSlides - 1}
                className="px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-zinc-900 text-white hover:bg-zinc-800 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center space-x-1"
              >
                <span>Next</span>
                <LucideIcon name="chevron-right" className="w-4 h-4" fallbackEmoji="▶" />
              </button>
            </div>

            {/* Slide Quick Select Dropdown */}
            <div className="flex items-center space-x-2">
              <span className="text-xs text-zinc-500 font-mono hidden sm:inline">Jump to:</span>
              <select
                value={currentSlideIdx}
                onChange={(e) => setCurrentSlideIdx(Number(e.target.value))}
                className="text-xs font-mono bg-zinc-50 border border-zinc-200 rounded-lg px-2.5 py-1.5 text-zinc-800 focus:outline-none focus:ring-2 focus:ring-zinc-900 max-w-[200px] sm:max-w-xs"
              >
                {slides.map((s, idx) => (
                  <option key={idx} value={idx}>
                    Slide {s.n}: {s.title}
                  </option>
                ))}
              </select>
            </div>

            <div className="text-xs font-mono text-zinc-500 hidden md:block">
              Press <kbd className="px-1.5 py-0.5 bg-zinc-100 border border-zinc-300 rounded text-zinc-700">?</kbd> for shortcuts
            </div>
          </footer>

          {/* Drawer: Speaker Notes */}
          {showNotes && (
            <div className="absolute bottom-16 right-4 w-96 max-w-full bg-zinc-900 text-white p-4 rounded-xl shadow-2xl border border-zinc-700 z-30 animate-in slide-in-from-bottom-4">
              <div className="flex items-center justify-between pb-2 mb-2 border-b border-zinc-700">
                <div className="flex items-center space-x-2 text-xs font-mono font-semibold text-zinc-300 uppercase">
                  <LucideIcon name="message-square" className="w-4 h-4 text-zinc-400" fallbackEmoji="💬" />
                  <span>Trainer Guidance</span>
                </div>
                <button 
                  onClick={() => setShowNotes(false)}
                  className="text-zinc-400 hover:text-white p-1"
                >
                  <LucideIcon name="x" className="w-4 h-4" fallbackEmoji="✖" />
                </button>
              </div>
              <p className="text-xs text-zinc-300 leading-relaxed font-sans">
                {slide.notes || "No trainer notes for this slide."}
              </p>
            </div>
          )}

          {/* Modal: Overview Grid Modal */}
          {showGrid && (
            <div className="fixed inset-0 bg-zinc-950/80 backdrop-blur-sm z-50 flex flex-col p-6 overflow-hidden">
              <div className="flex items-center justify-between mb-4 text-white">
                <div>
                  <h2 className="text-xl font-bold">Slide Overview</h2>
                  <p className="text-xs text-zinc-400 font-mono">Select any slide to navigate directly</p>
                </div>
                <button
                  onClick={() => setShowGrid(false)}
                  className="p-2 bg-zinc-800 hover:bg-zinc-700 rounded-lg text-white"
                >
                  <LucideIcon name="x" className="w-5 h-5" fallbackEmoji="✖" />
                </button>
              </div>

              <div className="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 p-2">
                {slides.map((s, idx) => (
                  <button
                    key={idx}
                    onClick={() => jumpToSlide(idx)}
                    className={`p-3 rounded-lg border text-left flex flex-col justify-between transition h-28 relative overflow-hidden ${
                      idx === currentSlideIdx 
                        ? 'bg-zinc-900 text-white border-zinc-400 ring-2 ring-white' 
                        : 'bg-white text-zinc-900 border-zinc-200 hover:border-zinc-400'
                    }`}
                  >
                    <span className="text-[10px] font-mono font-bold uppercase tracking-wider text-zinc-400">
                      #{s.n} • {s.section}
                    </span>
                    <h3 className="text-xs font-bold line-clamp-2 mt-1">
                      {s.title}
                    </h3>
                    <div className="mt-2 text-[10px] opacity-60 truncate">
                      {s.type} slide
                    </div>
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* Modal: Keyboard Shortcuts */}
          {showShortcuts && (
            <div className="fixed inset-0 bg-zinc-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl border border-zinc-200">
                <div className="flex items-center justify-between pb-3 mb-4 border-b border-zinc-200">
                  <h3 className="text-base font-bold text-zinc-900 flex items-center space-x-2">
                    <LucideIcon name="keyboard" className="w-5 h-5 text-zinc-700" fallbackEmoji="⌨️" />
                    <span>Keyboard Shortcuts</span>
                  </h3>
                  <button onClick={() => setShowShortcuts(false)} className="text-zinc-400 hover:text-zinc-700">
                    <LucideIcon name="x" className="w-4 h-4" fallbackEmoji="✖" />
                  </button>
                </div>

                <div className="space-y-2.5 text-xs font-mono">
                  <div className="flex justify-between items-center p-2 bg-zinc-50 rounded border border-zinc-200">
                    <span>Next Slide</span>
                    <span className="bg-white px-2 py-0.5 rounded border text-zinc-800">Right Arrow / Space</span>
                  </div>
                  <div className="flex justify-between items-center p-2 bg-zinc-50 rounded border border-zinc-200">
                    <span>Previous Slide</span>
                    <span className="bg-white px-2 py-0.5 rounded border text-zinc-800">Left Arrow</span>
                  </div>
                  <div className="flex justify-between items-center p-2 bg-zinc-50 rounded border border-zinc-200">
                    <span>Trainer Notes</span>
                    <span className="bg-white px-2 py-0.5 rounded border text-zinc-800">N</span>
                  </div>
                  <div className="flex justify-between items-center p-2 bg-zinc-50 rounded border border-zinc-200">
                    <span>Slide Overview Grid</span>
                    <span className="bg-white px-2 py-0.5 rounded border text-zinc-800">G</span>
                  </div>
                  <div className="flex justify-between items-center p-2 bg-zinc-50 rounded border border-zinc-200">
                    <span>Fullscreen Mode</span>
                    <span className="bg-white px-2 py-0.5 rounded border text-zinc-800">F</span>
                  </div>
                </div>

                <button
                  onClick={() => setShowShortcuts(false)}
                  className="w-full mt-5 py-2 bg-zinc-900 text-white rounded-lg text-xs font-medium hover:bg-zinc-800 transition"
                >
                  Got it
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
